spring:
  application:
    name: fitness-monolith

  datasource:
    url: jdbc:postgresql://localhost:5432/fitnessdb
    username: postgres
    password: postgre
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
